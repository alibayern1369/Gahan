<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گاهان — بدون اتصال</title>
<style>
  body{font-family:Vazirmatn,Tahoma,sans-serif;background:#07090f;color:#eef1f9;display:flex;align-items:center;justify-content:center;min-height:100dvh;margin:0;padding:24px;text-align:center}
  .card{background:rgba(21,26,43,.7);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px 32px;max-width:340px}
  h1{font-size:18px;margin:16px 0 8px}
  p{font-size:13px;color:#a7b0c8;line-height:1.9;margin:0}
  .dot{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#6c63f1,#14b8a6);margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="dot">گاهان</div>
  <h1>اتصال اینترنت در دسترس نیست</h1>
  <p>ثبت حضور و غیاب نیاز به اتصال به اینترنت دارد. پس از برقراری اتصال دوباره تلاش کنید.</p>
</div>
</body>
</html>
